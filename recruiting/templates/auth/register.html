{% extends 'base.html' %}
{% block title %}Register · TalentMatch{% endblock %}
{% block content %}
<section class="panel narrow">
  <h1>Create an account</h1>
  <form method="post" class="stack">
    <label>Username<input name="username" maxlength="80" autocomplete="username" required></label>
    <label>Password<input type="password" name="password" minlength="8" autocomplete="new-password" required></label>
    <label>Role
      <select name="role" required>
        {% for role in roles %}<option value="{{ role }}">{{ role }}</option>{% endfor %}
      </select>
    </label>
    <button class="button" type="submit">Register</button>
  </form>
</section>
{% endblock %}
